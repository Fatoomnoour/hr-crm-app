{% extends "base.html" %}
{% block content %}
    <div class="container">
        <h2>قائمة الموظفين</h2>
        
        <!-- نموذج إضافة موظف جديد -->
        <div class="form-container">
            <h3>إضافة موظف جديد</h3>
            <form action="{{ url_for('add_employee') }}" method="POST">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                <div class="form-group">
                    <input type="text" name="name" placeholder="الاسم الكامل" required>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="البريد الإلكتروني" required>
                </div>
                <div class="form-group">
                    <select name="department" required>
                        <option value="">اختر القسم</option>
                        <option value="تقنية المعلومات">تقنية المعلومات</option>
                        <option value="الموارد البشرية">الموارد البشرية</option>
                        <option value="المالية">المالية</option>
                        <option value="التسويق">التسويق</option>
                        <option value="المبيعات">المبيعات</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" name="job_title" placeholder="المسمى الوظيفي" required>
                </div>
                <button type="submit" class="btn btn-primary">إضافة موظف</button>
            </form>
        </div>
        
        <!-- نموذج التصفية -->
        <div class="filter-container">
            <h3>تصفية حسب القسم</h3>
            <form action="{{ url_for('filter_employees') }}" method="POST">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                <select name="department">
                    <option value="">كل الأقسام</option>
                    <option value="تقنية المعلومات">تقنية المعلومات</option>
                    <option value="الموارد البشرية">الموارد البشرية</option>
                    <option value="المالية">المالية</option>
                    <option value="التسويق">التسويق</option>
                    <option value="المبيعات">المبيعات</option>
                </select>
                <button type="submit" class="btn btn-secondary">تصفية</button>
            </form>
        </div>
        
        <!-- جدول الموظفين -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>البريد الإلكتروني</th>
                        <th>القسم</th>
                        <th>المسمى الوظيفي</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    {% for emp in employees %}
                    <tr>
                        <td>{{ emp.name }}</td>
                        <td>{{ emp.email }}</td>
                        <td>{{ emp.department }}</td>
                        <td>{{ emp.job_title }}</td>
                        <td class="actions">
                            <a href="{{ url_for('edit_employee', id=emp.id) }}" class="btn btn-edit">تعديل</a>
                            <form action="{{ url_for('delete_employee', id=emp.id) }}" method="POST" onsubmit="return confirm('هل أنت متأكد من حذف هذا الموظف؟');">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                                <button type="submit" class="btn btn-delete">حذف</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
